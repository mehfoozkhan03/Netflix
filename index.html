<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- Hero Section -->

    <header class="hero">
        <img src="././assets/images/bg/bg-img.jpg" class="hero-bg" alt="Netflix Background">
        <nav class="navbar">
            <h1 class="logo">NETFLIX</h1>
            <div class="nav-buttons">
                <button class="language">English</button>
                <button class="sign-in">Sign In</button>
            </div>
        </nav>

        <div class="hero-content">
            <h1>Unlimited movies,<br>shows, and more</h1>
            <h3>Starts at ₹149. Cancel at any time.</h3>
            <p>
                Ready to watch? Enter your email to create or restart your membership.
            </p>

            <div class="email-box">
                <input type="email" placeholder="Email address">
                <button>Get Started</button>
            </div>
        </div>
        
    </header>
    
    <button></button>
</body>

</html>
